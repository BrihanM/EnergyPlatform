name: mi-app-backend

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: mi-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.2.1-alpine3.22
    container_name: mi-app-redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres-bootstrap:
    image: postgres:18.6-alpine3.24
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      AUTH_FLYWAY_USERNAME: ${AUTH_FLYWAY_USERNAME:?AUTH_FLYWAY_USERNAME is required}
      AUTH_FLYWAY_PASSWORD: ${AUTH_FLYWAY_PASSWORD:?AUTH_FLYWAY_PASSWORD is required}
      ENERGY_MARKET_DB_USERNAME: ${ENERGY_MARKET_DB_USERNAME:?ENERGY_MARKET_DB_USERNAME is required}
      ENERGY_MARKET_DB_PASSWORD: ${ENERGY_MARKET_DB_PASSWORD:?ENERGY_MARKET_DB_PASSWORD is required}
      ENERGY_MARKET_FLYWAY_USERNAME: ${ENERGY_MARKET_FLYWAY_USERNAME:?ENERGY_MARKET_FLYWAY_USERNAME is required}
      ENERGY_MARKET_FLYWAY_PASSWORD: ${ENERGY_MARKET_FLYWAY_PASSWORD:?ENERGY_MARKET_FLYWAY_PASSWORD is required}
      ENERGY_MARKET_DB_SCHEMA: ${ENERGY_MARKET_DB_SCHEMA:-energy_market}
    volumes:
      - ./infrastructure/postgres/bootstrap-roles.sql:/bootstrap-roles.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap-roles.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-internal

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      AUTH_FLYWAY_USERNAME: ${AUTH_FLYWAY_USERNAME:?AUTH_FLYWAY_USERNAME is required}
      AUTH_FLYWAY_PASSWORD: ${AUTH_FLYWAY_PASSWORD:?AUTH_FLYWAY_PASSWORD is required}
      AUTH_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/pg-grants
      ENERGY_MARKET_FLYWAY_USERNAME: ${ENERGY_MARKET_FLYWAY_USERNAME:?ENERGY_MARKET_FLYWAY_USERNAME is required}
      ENERGY_MARKET_DB_USERNAME: ${ENERGY_MARKET_DB_USERNAME:?ENERGY_MARKET_DB_USERNAME is required}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_INTROSPECTION_SECRET: ${AUTH_INTROSPECTION_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION}
      REFRESH_TOKEN_COOKIE_NAME: ${REFRESH_TOKEN_COOKIE_NAME}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE}
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE}
      REFRESH_TOKEN_COOKIE_PATH: ${REFRESH_TOKEN_COOKIE_PATH}
      REFRESH_TOKEN_COOKIE_DOMAIN: ${REFRESH_TOKEN_COOKIE_DOMAIN}
      REFRESH_TOKEN_COOKIE_MAX_AGE: ${REFRESH_TOKEN_COOKIE_MAX_AGE}
      RBAC_BOOTSTRAP_ADMIN_USERNAME: ${RBAC_BOOTSTRAP_ADMIN_USERNAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  energy-market-service:
    build:
      context: .
      dockerfile: services/energy-market-service/Dockerfile
    environment:
      ENERGY_MARKET_SERVER_PORT: 8082
      ENERGY_MARKET_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      ENERGY_MARKET_DB_USERNAME: ${ENERGY_MARKET_DB_USERNAME:?ENERGY_MARKET_DB_USERNAME is required}
      ENERGY_MARKET_DB_PASSWORD: ${ENERGY_MARKET_DB_PASSWORD:?ENERGY_MARKET_DB_PASSWORD is required}
      ENERGY_MARKET_FLYWAY_USERNAME: ${ENERGY_MARKET_FLYWAY_USERNAME:?ENERGY_MARKET_FLYWAY_USERNAME is required}
      ENERGY_MARKET_FLYWAY_PASSWORD: ${ENERGY_MARKET_FLYWAY_PASSWORD:?ENERGY_MARKET_FLYWAY_PASSWORD is required}
      ENERGY_MARKET_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/pg-grants
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}
      ENERGY_MARKET_DB_SCHEMA: ${ENERGY_MARKET_DB_SCHEMA:-energy_market}
      ENERGY_MARKET_LOG_LEVEL: ${ENERGY_MARKET_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URI: http://auth-service:8081
      AUTH_INTROSPECTION_SECRET: ${AUTH_INTROSPECTION_SECRET}
      AUTH_INTROSPECTION_TIMEOUT: ${AUTH_INTROSPECTION_TIMEOUT:-2s}
      ENERGY_MARKET_SERVICE_URI: http://energy-market-service:8082
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-Correlation-ID,Idempotency-Key}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      CORS_MAX_AGE: ${CORS_MAX_AGE}
    depends_on:
      auth-service:
        condition: service_healthy
      energy-market-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks:
      - backend-internal
      - gateway-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  backend-internal:
    name: mi-app-backend-internal
    driver: bridge
    internal: true
  gateway-edge:
    driver: bridge

volumes:
  postgres-data:
    name: mi-app-postgres-data
  redis-data:
    name: mi-app-redis-data
