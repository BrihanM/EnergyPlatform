spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mi_app}}
    username: ${AUTH_DB_USERNAME:${POSTGRES_USER:mi_app}}
    password: ${AUTH_DB_PASSWORD:${POSTGRES_PASSWORD:change-me-local}}
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      minimum-idle: ${AUTH_DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: ${AUTH_FLYWAY_LOCATIONS:classpath:db/migration}
    user: ${AUTH_FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${AUTH_FLYWAY_PASSWORD:${spring.datasource.password}}
    placeholders:
      authRuntimeRole: ${AUTH_DB_USERNAME:mi_app}
      marketMigrationRole: ${ENERGY_MARKET_FLYWAY_USERNAME:mi_app}
      marketRuntimeRole: ${ENERGY_MARKET_DB_USERNAME:mi_app}
      # Sin valor por defecto: si falta AUTH_PII_ENCRYPTION_KEY la migración V8 no arranca.
      piiEncryptionKey: ${AUTH_PII_ENCRYPTION_KEY}

auth:
  pii:
    # Clave simétrica para pgcrypto (nombres de usuario). Proviene solo del entorno.
    encryption-key: ${AUTH_PII_ENCRYPTION_KEY}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.miapp.auth: INFO

security:
  introspection:
    secret: ${AUTH_INTROSPECTION_SECRET}
  jwt:
    issuer: ${JWT_ISSUER:mi-app-auth}
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
    cookie:
      name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
      secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
      same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
      path: ${REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
      domain: ${REFRESH_TOKEN_COOKIE_DOMAIN:}
      max-age: ${REFRESH_TOKEN_COOKIE_MAX_AGE:604800000}
  rbac:
    bootstrap-admin-username: ${RBAC_BOOTSTRAP_ADMIN_USERNAME:}
