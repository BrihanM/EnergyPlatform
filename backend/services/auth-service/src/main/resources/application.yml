spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mi_app}}
    username: ${AUTH_DB_USERNAME:${POSTGRES_USER:mi_app}}
    password: ${AUTH_DB_PASSWORD:${POSTGRES_PASSWORD:change-me-local}}
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      minimum-idle: ${AUTH_DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: INFO
    com.miapp.auth: INFO
