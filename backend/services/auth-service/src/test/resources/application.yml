spring:
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  introspection:
    secret: test-introspection-secret-at-least-32-characters
  jwt:
    issuer: test-issuer
    secret: test-jwt-secret-that-is-at-least-32-bytes-long
    expiration: "900000"
  refresh-token:
    expiration: "604800000"
    cookie:
      name: refresh_token
      secure: true
      same-site: Strict
      path: /api/v1/auth
      domain: ""
      max-age: "604800000"
