spring:
  application:
    name: energy-market-service
  datasource:
    url: ${ENERGY_MARKET_DB_URL:${AUTH_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:miapp}}}
    username: ${ENERGY_MARKET_DB_USERNAME:${AUTH_DB_USERNAME:${POSTGRES_USER:miapp}}}
    password: ${ENERGY_MARKET_DB_PASSWORD:${AUTH_DB_PASSWORD:${POSTGRES_PASSWORD:change-me-local}}}
    hikari:
      maximum-pool-size: ${ENERGY_MARKET_DB_POOL_SIZE:10}
      minimum-idle: ${ENERGY_MARKET_DB_MIN_IDLE:2}
  flyway:
    enabled: ${ENERGY_MARKET_FLYWAY_ENABLED:true}
    locations: ${ENERGY_MARKET_FLYWAY_LOCATIONS:classpath:db/migration}
    user: ${ENERGY_MARKET_FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${ENERGY_MARKET_FLYWAY_PASSWORD:${spring.datasource.password}}
    placeholders:
      marketRuntimeRole: ${ENERGY_MARKET_DB_USERNAME:miapp}
      authRuntimeRole: ${AUTH_DB_USERNAME:miapp}
    schemas: ${ENERGY_MARKET_DB_SCHEMA:energy_market}
    default-schema: ${ENERGY_MARKET_DB_SCHEMA:energy_market}
    create-schemas: true

server:
  port: ${ENERGY_MARKET_SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
  level:
    root: ${ENERGY_MARKET_LOG_LEVEL:INFO}
    com.miapp.energy: ${ENERGY_MARKET_LOG_LEVEL:INFO}

energy-market:
  simulation:
    mode: ${ENERGY_MARKET_SIMULATION_MODE:SUCCESS}
